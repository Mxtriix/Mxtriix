name: Profile cards

on:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Mxtriix&theme=darkhub&no-frame=true&column=4&margin-w=12&margin-h=12"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate statistics
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=Mxtriix&show_icons=true&theme=github_dark&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Save images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push

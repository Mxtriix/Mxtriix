name: Profile cards

on:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Mxtriix&theme=darkhub&no-frame=true&column=4&margin-w=12&margin-h=12"
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate statistics
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=Mxtriix&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate projects card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          count="$(gh api /user --jq '.public_repos + .owned_private_repos - 1')"
          mkdir -p profile

          printf '%s\n' \
            '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180">' \
            '<rect x="1" y="1" width="298" height="178" rx="12" fill="#0d1117" stroke="#30363d"/>' \
            '<text x="24" y="48" fill="#58a6ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Projets GitHub</text>' \
            "<text x=\"24\" y=\"122\" fill=\"#e6edf3\" font-family=\"Arial, sans-serif\" font-size=\"56\" font-weight=\"bold\">${count}</text>" \
            '<text x="24" y="155" fill="#8b949e" font-family="Arial, sans-serif" font-size="14">Publics + privés</text>' \
            '</svg>' > profile/projects.svg

      - name: Save images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
